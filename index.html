<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HABIT TRACKER</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --card-border: #232f48;
      --text: #f8fafc;
      --text-sub: #8292ab;
      --morning: #f59e0b;
      --afternoon: #38bdf8;
      --night: #a855f7;
      --border: #222f46;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; overflow-x: hidden; background-color: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    body { padding-bottom: 80px; }
    
    header { padding: 14px 16px; background: rgba(21, 29, 48, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.08em; color: #fff; }
    .btn-icon { background: none; border: none; color: var(--text-sub); font-size: 1.25rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }

    .nav-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); width: 100%; }
    .nav-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 0.85rem; color: var(--text-sub); font-weight: 700; letter-spacing: 0.05em; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .nav-tab.active { color: #fff; border-color: var(--afternoon); }

    .container { padding: 12px 14px; max-width: 600px; margin: 0 auto; width: 100%; }
    
    .section-title { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
    .title-morning { color: var(--morning); }
    .title-afternoon { color: var(--afternoon); }
    .title-night { color: var(--night); }
    
    /* カード */
    .habit-card { background: var(--card-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: relative; }
    .habit-info { flex: 1; min-width: 0; margin-right: 10px; }
    .habit-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .habit-desc { font-size: 0.72rem; color: var(--text-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* ボタン & カラーパレット */
    .action-group { position: relative; display: flex; align-items: center; }
    .check-btn { width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--card-border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: transparent; transition: all 0.2s; flex-shrink: 0; }
    .check-btn.checked { color: #fff; transform: scale(1.03); }

    .color-picker { display: none; position: absolute; right: 48px; background: #1a243b; border: 1px solid var(--card-border); padding: 6px 8px; border-radius: 10px; gap: 6px; z-index: 30; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
    .color-picker.show { display: flex; }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; border: none; cursor: pointer; transition: transform 0.1s; }
    .color-dot:active { transform: scale(0.9); }

    /* ヒートマップ（横スクロールのみ許容） */
    .matrix-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--card-border); border-radius: 10px; background: var(--card-bg); margin-top: 10px; }
    .matrix-table { border-collapse: collapse; font-size: 0.72rem; width: max-content; }
    .matrix-table th, .matrix-table td { padding: 6px 8px; text-align: center; border: 1px solid var(--card-border); }
    .matrix-table th { background: #1a243b; color: var(--text-sub); font-weight: 600; white-space: nowrap; }
    .matrix-table th.sticky-col, .matrix-table td.sticky-col { position: sticky; left: 0; background: var(--card-bg); z-index: 2; text-align: left; max-width: 130px; min-width: 110px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .matrix-table th.sticky-col { background: #1a243b; z-index: 3; }
    .matrix-cell { width: 22px; height: 22px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; background: #0f1626; font-size: 0.65rem; }
    .matrix-cell.filled { color: #fff; font-weight: bold; }

    /* モーダル */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; padding: 12px; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border-radius: 14px; padding: 18px 16px; width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--card-border); }
    .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    
    /* 並び替え対応リスト */
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; gap: 8px; }
    .manage-info { flex: 1; min-width: 0; }
    .manage-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reorder-btns { display: flex; gap: 4px; }
    .reorder-btn { background: #1f2b45; border: 1px solid var(--card-border); color: var(--text); border-radius: 6px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; }
    .reorder-btn:disabled { opacity: 0.2; cursor: default; }
    
    .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--border); border-radius: 22px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: var(--afternoon); }
    input:checked + .slider:before { transform: translateX(18px); }

    .input-box { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text); font-size: 0.85rem; margin-top: 8px; }
    .btn { width: 100%; padding: 11px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 0.85rem; }
    .btn-primary { background: var(--afternoon); color: var(--bg); }
    .btn-secondary { background: var(--card-border); color: var(--text); margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>HABIT TRACKER</h1>
    <button class="btn-icon" onclick="openModal('manage-modal')" title="Settings">⚙️</button>
  </header>

  <nav class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('today')">Today</div>
    <div class="nav-tab" onclick="switchTab('stats')">Heatmap</div>
  </nav>

  <div class="container" id="view-today">
    <div class="section-title title-morning">☀️ MORNING</div>
    <div id="list-morning"></div>

    <div class="section-title title-afternoon">🌤 AFTERNOON</div>
    <div id="list-afternoon"></div>

    <div class="section-title title-night">🌙 NIGHT</div>
    <div id="list-night"></div>
  </div>

  <div class="container" id="view-stats" style="display: none;">
    <div class="section-title" style="color: var(--text);">📊 HABIT HEATMAP (LAST 30 DAYS)</div>
    <div class="matrix-wrapper">
      <table class="matrix-table" id="matrix-table"></table>
    </div>
  </div>

  <!-- 設定 & 並び替えモーダル -->
  <div class="modal" id="manage-modal">
    <div class="modal-content">
      <div class="modal-title">Habits Order & Active</div>
      <p style="font-size:0.72rem; color:var(--text-sub); margin-bottom:10px;">Use ▲/▼ to reorder, toggle switches to show/hide.</p>
      
      <div id="manage-list"></div>

      <div class="modal-title" style="margin-top: 20px; font-size: 0.9rem;">Add New Habit</div>
      <select class="input-box" id="new-habit-time">
        <option value="morning">Morning</option>
        <option value="afternoon">Afternoon</option>
        <option value="night">Night</option>
      </select>
      <input type="text" class="input-box" id="new-habit-name" placeholder="Habit name (e.g. Morning Stretch)">
      <input type="text" class="input-box" id="new-habit-desc" placeholder="Details (e.g. Blue=Stretch, Pink=Run)">
      <button class="btn btn-primary" onclick="addNewHabit()">Add Habit</button>
      <button class="btn btn-secondary" onclick="closeModal('manage-modal')">Close</button>
    </div>
  </div>

  <script>
    const COLORS = [
      { name: 'Emerald', code: '#10b981' },
      { name: 'Blue',    code: '#3b82f6' },
      { name: 'Pink',    code: '#ec4899' },
      { name: 'Amber',   code: '#f59e0b' },
      { name: 'Purple',  code: '#8b5cf6' },
      { name: 'Red',     code: '#ef4444' }
    ];

    const DEFAULT_HABITS = [
      // 朝
      { id: 'm1', time: 'morning', name: 'やる気に頼らない着手', desc: '5秒ルールで起床・即行動', active: false },
      { id: 'm2', time: 'morning', name: '起床直後の水分補給', desc: '起き抜けに水＋塩分補給', active: false },
      { id: 'm3', time: 'morning', name: '朝起きてすぐの光', desc: '外に出て朝日を浴び体内時計リセット', active: true },
      { id: 'm4', time: 'morning', name: '朝のゾーン2運動', desc: 'ストレッチ(青) / ランニング(ピンク)', active: true },
      { id: 'm5', time: 'morning', name: '起床後90〜120分のカフェイン断ち', desc: '起きてすぐのコーヒーを控える', active: false },
      { id: 'm6', time: 'morning', name: 'スマホの物理的隔離', desc: '作業前に電源OFFまたは別室へ', active: true },
      { id: 'm7', time: 'morning', name: '朝一番のディープワーク', desc: '最重要タスクを朝イチで片付ける', active: false },
      { id: 'm8', time: 'morning', name: '集中音源とタイムアタック', desc: 'ブラウンノイズ＋タイマー', active: false },
      // 日中
      { id: 'a1', time: 'afternoon', name: 'オン・オフのメリハリ', desc: '瞑想またはNSDRで脳を回復', active: false },
      { id: 'a2', time: 'afternoon', name: '世界一ご機嫌な人のふり', desc: '外側の振る舞いで内面を変える', active: false },
      { id: 'a3', time: 'afternoon', name: '血糖値スパイクの防止', desc: '眠気・倦怠感を防ぐ昼食管理', active: false },
      { id: 'a4', time: 'afternoon', name: '思考の紙への書き出し', desc: '不安・モヤモヤを書き殴る', active: false },
      { id: 'a5', time: 'afternoon', name: '短期的な快楽の抑制', desc: 'ジャンクフード・無駄なSNS遮断', active: false },
      // 夜
      { id: 'n1', time: 'night', name: '就寝前のコンディショニング', desc: '寝る3時間前断食・暖色照明', active: false },
      { id: 'n2', time: 'night', name: '就寝90分前の入浴', desc: '40度の湯船で深部体温調整', active: false },
      { id: 'n3', time: 'night', name: '夜5分のジャーナリング', desc: 'KPT法で1日を振り返る', active: true },
      { id: 'n4', time: 'night', name: '成長と習慣の見える化', desc: 'トラッカー記録で自己効力感UP', active: false },
      { id: 'n5', time: 'night', name: '睡眠のQQRT（量・質・規則性）', desc: '早起きより睡眠時間・規則性を優先', active: true }
    ];

    let habits = JSON.parse(localStorage.getItem('habits_v3')) || DEFAULT_HABITS;
    let logs = JSON.parse(localStorage.getItem('habit_logs_v3')) || {};

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function save() {
      localStorage.setItem('habits_v3', JSON.stringify(habits));
      localStorage.setItem('habit_logs_v3', JSON.stringify(logs));
    }

    function setHabitColor(habitId, color) {
      const today = getTodayKey();
      if (!logs[today]) logs[today] = {};
      
      if (logs[today][habitId] === color) {
        delete logs[today][habitId];
      } else {
        logs[today][habitId] = color;
      }
      
      save();
      renderToday();
    }

    function togglePicker(habitId) {
      document.querySelectorAll('.color-picker').forEach(p => {
        if (p.id !== `picker-${habitId}`) p.classList.remove('show');
      });
      const picker = document.getElementById(`picker-${habitId}`);
      if (picker) picker.classList.toggle('show');
    }

    function renderToday() {
      const today = getTodayKey();
      const todayLogs = logs[today] || {};

      ['morning', 'afternoon', 'night'].forEach(time => {
        const container = document.getElementById(`list-${time}`);
        container.innerHTML = '';
        const list = habits.filter(h => h.time === time && h.active);
        
        if (list.length === 0) {
          container.innerHTML = `<div style="font-size:0.75rem; color:var(--text-sub); padding:6px 0;">No active habits in this section.</div>`;
          return;
        }

        list.forEach(h => {
          const activeColor = todayLogs[h.id] || null;
          const isDone = !!activeColor;
          const div = document.createElement('div');
          div.className = 'habit-card';

          let pickerDots = COLORS.map(c => 
            `<button class="color-dot" style="background:${c.code}" onclick="setHabitColor('${h.id}', '${c.code}')"></button>`
          ).join('');

          div.innerHTML = `
            <div class="habit-info">
              <div class="habit-name">${h.name}</div>
              <div class="habit-desc">${h.desc}</div>
            </div>
            <div class="action-group">
              <div class="color-picker" id="picker-${h.id}">
                ${pickerDots}
              </div>
              <button 
                class="check-btn ${isDone ? 'checked' : ''}" 
                style="${isDone ? `background:${activeColor}; border-color:${activeColor};` : ''}"
                onclick="togglePicker('${h.id}')">
                ✓
              </button>
            </div>
          `;
          container.appendChild(div);
        });
      });
    }

    function renderHeatmap() {
      const table = document.getElementById('matrix-table');
      table.innerHTML = '';

      const days = [];
      const today = new Date();
      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        days.push({ key, label: `${d.getMonth()+1}/${d.getDate()}` });
      }

      let thead = '<thead><tr><th class="sticky-col">Habit</th>';
      days.forEach(day => { thead += `<th>${day.label}</th>`; });
      thead += '</tr></thead>';

      let tbody = '<tbody>';
      const activeHabits = habits.filter(h => h.active);

      activeHabits.forEach(h => {
        let timeColor = h.time === 'morning' ? 'var(--morning)' : h.time === 'afternoon' ? 'var(--afternoon)' : 'var(--night)';
        tbody += `<tr><td class="sticky-col" style="color:${timeColor}" title="${h.name}">${h.name}</td>`;
        days.forEach(day => {
          const dayLog = logs[day.key] || {};
          const cellColor = dayLog[h.id];
          if (cellColor) {
            tbody += `<td><span class="matrix-cell filled" style="background:${cellColor}">✓</span></td>`;
          } else {
            tbody += `<td><span class="matrix-cell"></span></td>`;
          }
        });
        tbody += '</tr>';
      });
      tbody += '</tbody>';

      table.innerHTML = thead + tbody;
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'today' && i === 0) || (tab === 'stats' && i === 1));
      });
      document.getElementById('view-today').style.display = tab === 'today' ? 'block' : 'none';
      document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';
      if (tab === 'stats') renderHeatmap();
    }

    /* 並び替え対応のモーダルレンダリング */
    function renderManageModal() {
      const container = document.getElementById('manage-list');
      container.innerHTML = '';
      
      ['morning', 'afternoon', 'night'].forEach(t => {
        const timeHabits = habits.filter(h => h.time === t);
        const timeLabel = t === 'morning' ? 'Morning' : t === 'afternoon' ? 'Afternoon' : 'Night';
        const timeColor = t === 'morning' ? 'var(--morning)' : t === 'afternoon' ? 'var(--afternoon)' : 'var(--night)';
        
        const headerDiv = document.createElement('div');
        headerDiv.style.cssText = `font-size:0.75rem; font-weight:800; color:${timeColor}; margin:12px 0 4px;`;
        headerDiv.innerText = timeLabel;
        container.appendChild(headerDiv);

        timeHabits.forEach((h, index) => {
          const div = document.createElement('div');
          div.className = 'manage-item';
          div.innerHTML = `
            <div class="manage-info">
              <div class="manage-name">${h.name}</div>
            </div>
            <div class="reorder-btns">
              <button class="reorder-btn" ${index === 0 ? 'disabled' : ''} onclick="moveHabit('${h.id}', -1)">▲</button>
              <button class="reorder-btn" ${index === timeHabits.length - 1 ? 'disabled' : ''} onclick="moveHabit('${h.id}', 1)">▼</button>
            </div>
            <label class="switch">
              <input type="checkbox" ${h.active ? 'checked' : ''} onchange="toggleActive('${h.id}')">
              <span class="slider"></span>
            </label>
          `;
          container.appendChild(div);
        });
      });
    }

    function moveHabit(id, direction) {
      const idx = habits.findIndex(h => h.id === id);
      if (idx === -1) return;
      const current = habits[idx];
      
      // 同じ時間帯のアイテム同士で位置を入れ替え
      let targetIdx = -1;
      if (direction === -1) {
        for (let i = idx - 1; i >= 0; i--) {
          if (habits[i].time === current.time) { targetIdx = i; break; }
        }
      } else {
        for (let i = idx + 1; i < habits.length; i++) {
          if (habits[i].time === current.time) { targetIdx = i; break; }
        }
      }

      if (targetIdx !== -1) {
        const temp = habits[idx];
        habits[idx] = habits[targetIdx];
        habits[targetIdx] = temp;
        save();
        renderManageModal();
        renderToday();
      }
    }

    function toggleActive(id) {
      const target = habits.find(h => h.id === id);
      if (target) target.active = !target.active;
      save();
      renderToday();
    }

    function addNewHabit() {
      const time = document.getElementById('new-habit-time').value;
      const name = document.getElementById('new-habit-name').value.trim();
      const desc = document.getElementById('new-habit-desc').value.trim();
      if (!name) return alert('Please enter a habit name.');

      habits.push({ id: 'custom_' + Date.now(), time, name, desc, active: true });
      save();
      document.getElementById('new-habit-name').value = '';
      document.getElementById('new-habit-desc').value = '';
      renderManageModal();
      renderToday();
    }

    function openModal(id) {
      if (id === 'manage-modal') renderManageModal();
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.action-group')) {
        document.querySelectorAll('.color-picker').forEach(p => p.classList.remove('show'));
      }
    });

    renderToday();
  </script>
</body>
</html>
