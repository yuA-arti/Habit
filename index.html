<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>自己管理室 トラッカー</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 70px; -webkit-tap-highlight-color: transparent; }
    
    header { padding: 16px 20px; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .btn-icon { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

    .nav-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); }
    .nav-tab { flex: 1; text-align: center; padding: 12px 0; font-size: 0.85rem; color: var(--text-sub); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
    .nav-tab.active { color: var(--accent); border-color: var(--accent); }

    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub); letter-spacing: 0.05em; margin: 16px 0 8px; }
    
    .habit-card { background: var(--card-bg); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
    .habit-info { flex: 1; margin-right: 12px; }
    .habit-name { font-size: 0.95rem; font-weight: 600; }
    .habit-desc { font-size: 0.75rem; color: var(--text-sub); margin-top: 2px; }
    
    /* 塗りつぶしボタン */
    .check-btn { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: transparent; transition: all 0.2s; }
    .check-btn.checked { background: var(--success); border-color: var(--success); color: #fff; transform: scale(1.05); }

    /* 設定 & 編集モーダル */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border-radius: 16px; padding: 20px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }
    
    .manage-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .switch { position: relative; width: 42px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--border); border-radius: 24px; transition: .2s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: .2s; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(18px); }

    /* ヒートマップ（草）ビュー */
    .heatmap-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
    .heat-box { aspect-ratio: 1; border-radius: 4px; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: var(--text-sub); }
    .heat-lvl-1 { background: #064e3b; color: #a7f3d0; }
    .heat-lvl-2 { background: #047857; color: #fff; }
    .heat-lvl-3 { background: #10b981; color: #fff; }

    .input-box { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.9rem; margin-top: 8px; }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; margin-top: 12px; }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-secondary { background: var(--border); color: var(--text); margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>自己管理室 Tracker</h1>
    <div>
      <button class="btn-icon" onclick="requestNotification()" title="通知設定">🔔</button>
      <button class="btn-icon" onclick="openModal('manage-modal')" style="margin-left: 10px;" title="習慣の管理">⚙️</button>
    </div>
  </header>

  <nav class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('today')">今日</div>
    <div class="nav-tab" onclick="switchTab('stats')">ヒートマップ</div>
  </nav>

  <div class="container" id="view-today">
    <div class="section-title">朝 (Morning)</div>
    <div id="list-morning"></div>

    <div class="section-title">日中 (Afternoon)</div>
    <div id="list-afternoon"></div>

    <div class="section-title">夜 (Night)</div>
    <div id="list-night"></div>
  </div>

  <div class="container" id="view-stats" style="display: none;">
    <div class="section-title">過去30日間の塗りつぶし記録</div>
    <div class="heatmap-grid" id="heatmap-container"></div>
  </div>

  <!-- 項目設定モーダル（絞り込み・追加・削除） -->
  <div class="modal" id="manage-modal">
    <div class="modal-content">
      <div class="modal-title">追跡する習慣の選択（絞り込み）</div>
      <p style="font-size:0.75rem; color:var(--text-sub); margin-bottom:12px;">※疲れないよう、今追うものだけON（3〜5個推奨）にしてください</p>
      <div id="manage-list"></div>

      <div class="modal-title" style="margin-top: 24px; font-size: 0.95rem;">新しい習慣の追加</div>
      <select class="input-box" id="new-habit-time">
        <option value="morning">朝</option>
        <option value="afternoon">日中</option>
        <option value="night">夜</option>
      </select>
      <input type="text" class="input-box" id="new-habit-name" placeholder="習慣の名前">
      <input type="text" class="input-box" id="new-habit-desc" placeholder="詳細（任意）">
      <button class="btn btn-primary" onclick="addNewHabit()">追加する</button>
      <button class="btn btn-secondary" onclick="closeModal('manage-modal')">閉じる</button>
    </div>
  </div>

  <script>
    const DEFAULT_HABITS = [
      // 朝
      { id: 'm1', time: 'morning', name: 'やる気に頼らない着手', desc: '5秒ルールで起床・即行動', active: false },
      { id: 'm2', time: 'morning', name: '起床直後の水分補給', desc: '起き抜けに水＋塩分補給', active: false },
      { id: 'm3', time: 'morning', name: '朝起きてすぐの光', desc: '外に出て朝日を浴び体内時計リセット', active: true },
      { id: 'm4', time: 'morning', name: '朝のゾーン2運動', desc: '会話できる程度の軽いランや散歩', active: false },
      { id: 'm5', time: 'morning', name: '起床後90〜120分のカフェイン断ち', desc: '起きてすぐのコーヒーを控える', active: false },
      { id: 'm6', time: 'morning', name: 'スマホの物理的隔離', desc: '作業前に電源OFFまたは別室へ', active: true },
      { id: 'm7', time: 'morning', name: '朝一番のディープワーク', desc: '最重要タスクを朝イチで片付ける', active: true },
      { id: 'm8', time: 'morning', name: '集中音源とタイムアタック', desc: 'ブラウンノイズ＋タイマー', active: false },
      // 日中
      { id: 'a1', time: 'afternoon', name: 'オン・オフのメリハリ', desc: '瞑想またはNSDRで脳を回復', active: false },
      { id: 'a2', time: 'afternoon', name: '世界一ご機嫌な人のふり', desc: '外側の振る舞いで内面を変える', active: false },
      { id: 'a3', time: 'afternoon', name: '血糖値スパイクの防止', desc: '眠気・倦怠感を防ぐ昼食管理', active: false },
      { id: 'a4', time: 'afternoon', name: '思考の紙への書き出し', desc: '不安・モヤモヤを書き殴る', active: false },
      { id: 'a5', time: 'afternoon', name: '短期的な快楽の抑制', desc: 'ジャンクフード・無駄なSNS遮断', active: false },
      // 夜
      { id: 'n1', time: 'night', name: '就寝前のコンディショニング', desc: '寝る3時間前断食・暖色照明', active: false },
      { id: 'n2', time: 'night', name: '就寝90分前の入浴', desc: '40度の湯船で深部体温調整', active: false },
      { id: 'n3', time: 'night', name: '夜5分のジャーナリング', desc: 'KPT法で1日を振り返る', active: true },
      { id: 'n4', time: 'night', name: '成長と習慣の見える化', desc: 'トラッカー記録で自己効力感UP', active: false },
      { id: 'n5', time: 'night', name: '睡眠のQQRT（量・質・規則性）', desc: '早起きより睡眠時間・規則性を優先', active: true }
    ];

    let habits = JSON.parse(localStorage.getItem('habits')) || DEFAULT_HABITS;
    let logs = JSON.parse(localStorage.getItem('habit_logs')) || {}; // { 'YYYY-MM-DD': ['m3', 'm6'] }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function save() {
      localStorage.setItem('habits', JSON.stringify(habits));
      localStorage.setItem('habit_logs', JSON.stringify(logs));
    }

    function toggleHabit(id) {
      const today = getTodayKey();
      if (!logs[today]) logs[today] = [];
      const idx = logs[today].indexOf(id);
      if (idx > -1) {
        logs[today].splice(idx, 1);
      } else {
        logs[today].push(id);
      }
      save();
      renderToday();
    }

    function renderToday() {
      const today = getTodayKey();
      const doneList = logs[today] || [];

      ['morning', 'afternoon', 'night'].forEach(time => {
        const container = document.getElementById(`list-${time}`);
        container.innerHTML = '';
        const list = habits.filter(h => h.time === time && h.active);
        
        if (list.length === 0) {
          container.innerHTML = `<div style="font-size:0.8rem; color:var(--text-sub); padding:8px 0;">追跡中の項目がありません（右上の⚙️から追加可能）</div>`;
          return;
        }

        list.forEach(h => {
          const isDone = doneList.includes(h.id);
          const div = document.createElement('div');
          div.className = 'habit-card';
          div.innerHTML = `
            <div class="habit-info">
              <div class="habit-name">${h.name}</div>
              <div class="habit-desc">${h.desc}</div>
            </div>
            <button class="check-btn ${isDone ? 'checked' : ''}" onclick="toggleHabit('${h.id}')">
              ✓
            </button>
          `;
          container.appendChild(div);
        });
      });
    }

    function renderManageModal() {
      const container = document.getElementById('manage-list');
      container.innerHTML = '';
      habits.forEach(h => {
        const div = document.createElement('div');
        div.className = 'manage-item';
        div.innerHTML = `
          <div>
            <div>${h.name}</div>
            <div style="font-size:0.7rem; color:var(--text-sub)">${h.time === 'morning' ? '朝' : h.time === 'afternoon' ? '日中' : '夜'}</div>
          </div>
          <label class="switch">
            <input type="checkbox" ${h.active ? 'checked' : ''} onchange="toggleActive('${h.id}')">
            <span class="slider"></span>
          </label>
        `;
        container.appendChild(div);
      });
    }

    function toggleActive(id) {
      const target = habits.find(h => h.id === id);
      if (target) target.active = !target.active;
      save();
      renderToday();
    }

    function addNewHabit() {
      const time = document.getElementById('new-habit-time').value;
      const name = document.getElementById('new-habit-name').value.trim();
      const desc = document.getElementById('new-habit-desc').value.trim();
      if (!name) return alert('習慣の名前を入力してください');

      habits.push({ id: 'custom_' + Date.now(), time, name, desc, active: true });
      save();
      document.getElementById('new-habit-name').value = '';
      document.getElementById('new-habit-desc').value = '';
      renderManageModal();
      renderToday();
      alert('追加しました！');
    }

    function renderHeatmap() {
      const container = document.getElementById('heatmap-container');
      container.innerHTML = '';
      const today = new Date();

      for (let i = 29; i >= 0; i--) {
        const d = new Date();
        d.setDate(today.getDate() - i);
        const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const count = (logs[k] || []).length;

        const box = document.createElement('div');
        box.className = 'heat-box';
        if (count >= 4) box.classList.add('heat-lvl-3');
        else if (count >= 2) box.classList.add('heat-lvl-2');
        else if (count >= 1) box.classList.add('heat-lvl-1');
        
        box.innerText = d.getDate();
        box.title = `${k}: ${count}個達成`;
        container.appendChild(box);
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.nav-tab').forEach((t, i) => {
        t.classList.toggle('active', (tab === 'today' && i === 0) || (tab === 'stats' && i === 1));
      });
      document.getElementById('view-today').style.display = tab === 'today' ? 'block' : 'none';
      document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';
      if (tab === 'stats') renderHeatmap();
    }

    function openModal(id) {
      if (id === 'manage-modal') renderManageModal();
      document.getElementById(id).classList.add('active');
    }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // 通知許可 & タイマー通知
    function requestNotification() {
      if (!("Notification" in window)) return alert("このブラウザは通知に対応していません");
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("通知を許可しました！朝7時、昼12時、夜21時にリマインドします（ページを開いている時/バックグラウンド時）");
          checkNotificationSchedule();
        }
      });
    }

    function checkNotificationSchedule() {
      setInterval(() => {
        const now = new Date();
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();
        if (m === 0 && s === 0) {
          if (h === 7) new Notification("朝のルーティン", { body: "朝日・水分・最優先タスクを意識しましょう！" });
          if (h === 12) new Notification("日中のルーティン", { body: "ご機嫌な振る舞い・血糖値管理・脳の小休憩！" });
          if (h === 21) new Notification("夜のルーティン", { body: "今日のKPTジャーナリングと塗りつぶし記録をしましょう！" });
        }
      }, 1000);
    }

    // 初期起動
    renderToday();
  </script>
</body>
</html>
